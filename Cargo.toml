[package]
name = "cssdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Diff the computed CSS styles of every element of two versions of a site, at every viewport, without a browser."
license = "MIT"
repository = "https://github.com/DorskFR/cssdiff"
keywords = ["css", "regression", "computed-style", "diff", "stylo"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming"]

[dependencies]
anyhow = "1.0.104"
blitz-dom = { version = "0.3.0-beta.4", default-features = false, features = ["floats", "writing-mode"] }
blitz-html = { version = "0.3.0-beta.4", default-features = false }
blitz-traits = { version = "0.3.0-beta.4", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stylo = "0.22"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
